<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>無限煉製小遊戲入口站</title>
<meta name="description" content="《無限煉製》本傳與玩家自製小遊戲的入口站。">
<meta name="theme-color" content="#140f0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">

<style>
:root{
  --bg:#140f0a;
  --bg2:#1d1610;
  --panel:#261c13;
  --line:#4a3924;
  --gold:#e9c46a;
  --gold-soft:#c9a24a;
  --cream:#f4e8cc;
  --muted:#a8977a;
  --orange1:#f08a4b;
  --orange2:#c9512c;
  --purple:#b48cff;
  --teal:#7fd0b8;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--cream);font-family:var(--sans);line-height:1.7;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(233,196,106,.14),transparent 70%);
  background-repeat:no-repeat;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

/* hero */
.hero{padding:56px 0 28px;text-align:center}
.hero h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,52px);line-height:1.25;margin:0 0 12px;
  color:var(--cream);text-shadow:0 0 32px rgba(233,196,106,.35);letter-spacing:.04em;
}
.hero p{margin:0 auto;max-width:34em;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:28px auto 0;max-width:760px}
.chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
  background:rgba(38,28,19,.9);border:1.5px solid var(--line);font-size:15px;color:var(--cream);
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.chip:hover{transform:translateY(-2px)}
.chip .e{font-size:18px;line-height:1}
.chip.p{border-color:rgba(180,140,255,.6)}
.chip.p:hover{box-shadow:0 0 16px rgba(180,140,255,.35)}
.chip.t{border-color:rgba(127,208,184,.5)}
.chip.t:hover{box-shadow:0 0 16px rgba(127,208,184,.3)}
.chip.g{border-color:rgba(233,196,106,.7);box-shadow:0 0 14px rgba(233,196,106,.2)}

/* sections */
section{padding:34px 0 8px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head h2{font-family:var(--serif);font-size:24px;margin:0;color:var(--gold)}
.sec-head span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:18px}
#g-main{grid-template-columns:minmax(0,1fr)}

/* cards */
.card{
  display:flex;flex-direction:column;background:var(--panel);border:1.5px solid var(--line);
  border-radius:18px;overflow:hidden;scroll-margin-top:16px;min-width:0;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.card:hover{transform:translateY(-3px);border-color:var(--gold-soft);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 22px rgba(233,196,106,.12)}
.card.purple:hover{border-color:var(--purple);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 22px rgba(180,140,255,.2)}
.thumb{position:relative;aspect-ratio:16/9;background:#0e0a07;overflow:hidden}
.thumb img,.thumb svg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.body{display:flex;flex-direction:column;flex:1;min-width:0;overflow-wrap:anywhere;padding:16px 18px 18px;gap:8px}
.body h3{font-family:var(--serif);font-size:20px;margin:0;color:var(--cream)}
.body p{margin:0;font-size:14px;color:#d3c4a4;flex:1}
.note{font-size:13px;color:var(--orange1);background:rgba(240,138,75,.1);border:1px solid rgba(240,138,75,.35);border-radius:10px;padding:6px 10px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.author{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{
  flex:none;padding:8px 20px;border-radius:12px;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--orange1),var(--orange2));box-shadow:0 4px 14px rgba(201,81,44,.35);
}
.go:hover{filter:brightness(1.1)}


/* likes */
.thumb-link{position:absolute;inset:0;display:block}
.like{
  display:none;position:absolute;top:10px;right:10px;z-index:2;align-items:center;gap:6px;
  padding:6px 12px 6px 10px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;font-weight:700;
  color:var(--cream);background:rgba(20,15,10,.72);border:1.5px solid rgba(233,196,106,.4);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:transform .12s,border-color .15s,background .15s;
}
.fb-on .like{display:inline-flex}
.like svg{position:static;width:18px;height:18px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;transition:fill .15s,stroke .15s,transform .15s}
.like:hover{border-color:var(--gold)}
.like:active{transform:scale(.94)}
.like[aria-pressed="true"]{background:rgba(201,81,44,.28);border-color:var(--orange1)}
.like[aria-pressed="true"] svg{fill:#f2663b;stroke:#f2663b;transform:scale(1.08)}
.like:disabled{opacity:.6;cursor:wait}
.like.err{border-color:#e5484d}
.like .n{min-width:1ch;font-variant-numeric:tabular-nums}

/* featured main game */
.card.feature{border-color:var(--gold-soft);box-shadow:0 0 28px rgba(233,196,106,.16)}
@media(min-width:760px){
  .card.feature{flex-direction:row}
  .card.feature .thumb{flex:0 0 46%;aspect-ratio:auto;min-height:280px}
  .card.feature .body{padding:26px 28px;justify-content:center}
  .card.feature h3{font-size:28px}
  .card.feature p{flex:none;font-size:16px}
}

footer{margin:48px 0 0;padding:24px 0 40px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function artSvg(key){
  return `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">${ART[key]}</svg>`;
}

function card(g){
  const el = document.createElement('article');
  el.id = g.id;
  el.className = 'card' + (g.feature ? ' feature' : '') + (g.purple ? ' purple' : '');
  const thumb = g.img
    ? `<img src="${esc(g.img)}" alt="${esc(g.name)} 縮圖" loading="lazy">`
    : artSvg(g.art);
  el.innerHTML = `
    <div class="thumb">
      <a class="thumb-link" href="${esc(g.url)}" target="_blank" rel="noopener" aria-label="開啟 ${esc(g.name)}">${thumb}</a>
      <button class="like" type="button" aria-pressed="false" aria-label="按讚 ${esc(g.name)}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.6 4.5 7 4.5c2 0 3.5 1.1 5 3 1.5-1.9 3-3 5-3 3.4 0 5.4 3.3 4.2 6.7C19.5 15.9 12 20.5 12 20.5Z"/></svg>
        <span class="n">0</span>
      </button>
    </div>
    <div class="body">
      <h3>${esc(g.name)}</h3>
      <p>${esc(g.desc)}</p>
      ${g.note ? `<div class="note">${esc(g.note)}</div>` : ''}
      <div class="meta">
        <span class="author">作者:${esc(g.author)}</span>
        <a class="go" href="${esc(g.url)}" target="_blank" rel="noopener">開始玩</a>
      </div>
    </div>`;
  if (g.img) {
    // 縮圖載入失敗時,改用生成的插圖
    el.querySelector('img').addEventListener('error', e => {
      e.target.replaceWith(Object.assign(document.createElement('div'), {innerHTML: artSvg(g.art)}).firstChild);
    });
  }
  return el;
}

const targets = {main:'g-main', funtuan:'g-funtuan', players:'g-players'};
const chipsEl = document.getElementById('chips');
GAMES.forEach(g => {
  document.getElementById(targets[g.sec]).appendChild(card(g));
  const a = document.createElement('a');
  a.className = 'chip ' + g.chip;
  a.href = '#' + g.id;
  a.innerHTML = `<span class="e">${g.emoji}</span>${esc(g.name)}`;
  chipsEl.appendChild(a);
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* 把 Firebase 控制台給你的設定貼在這裡(專案設定 → 一般 → 你的應用程式) */
const firebaseConfig = {
  apiKey: "AIzaSyD7HsmK0LvftOsQTZ0vwR7NTLfXZXcYmis",
  authDomain: "infinite-games-d2b75.firebaseapp.com",
  projectId: "infinite-games-d2b75",
  storageBucket: "infinite-games-d2b75.firebasestorage.app",
  messagingSenderId: "129129111516",
  appId: "1:129129111516:web:fa083fc4e25ba8f8fe7919",
  measurementId: "G-003DGX030V"
};

if (!firebaseConfig.apiKey.startsWith("YOUR_")) {
  document.body.classList.add("fb-on");
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const cards = [...document.querySelectorAll(".card")];
  const byId = Object.fromEntries(cards.map(c => [c.id, c.querySelector(".like")]));
  const LS = id => "liked:" + id;

  // 先用本機紀錄顯示「我按過讚」,點擊時會再跟伺服器核對
  for (const [id, btn] of Object.entries(byId)) {
    btn.setAttribute("aria-pressed", localStorage.getItem(LS(id)) === "1" ? "true" : "false");
  }

  // 即時讀取所有讚數
  onSnapshot(collection(db, "likes"), snap => {
    snap.forEach(d => {
      const btn = byId[d.id];
      if (btn) btn.querySelector(".n").textContent = d.data().count ?? 0;
    });
  }, err => console.warn("讀取讚數失敗", err));

  const ready = new Promise(res => onAuthStateChanged(auth, u => u && res(u)));
  signInAnonymously(auth).catch(err => console.warn("匿名登入失敗", err));

  for (const [id, btn] of Object.entries(byId)) {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        const user = await ready;
        const cRef = doc(db, "likes", id);
        const uRef = doc(db, "likes", id, "users", user.uid);
        const liked = await runTransaction(db, async tx => {
          const [c, u] = await Promise.all([tx.get(cRef), tx.get(uRef)]);
          const n = c.exists() ? c.data().count : 0;
          if (u.exists()) {
            tx.delete(uRef);
            tx.set(cRef, { count: Math.max(0, n - 1) });
            return false;
          }
          tx.set(uRef, { t: serverTimestamp() });
          tx.set(cRef, { count: n + 1 });
          return true;
        });
        btn.setAttribute("aria-pressed", String(liked));
        btn.setAttribute("aria-label", (liked ? "取消讚 " : "按讚 ") + id);
        liked ? localStorage.setItem(LS(id), "1") : localStorage.removeItem(LS(id));
      } catch (e) {
        console.error(e);
        btn.classList.add("err");
        setTimeout(() => btn.classList.remove("err"), 1500);
      } finally {
        btn.disabled = false;
      }
    });
  }
}
</script>
